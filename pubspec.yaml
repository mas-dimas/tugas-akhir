name: kompetisi_mobile
description: "Mobile app untuk sistem pendaftaran perlombaan. Aplikasi ini memungkinkan peserta untuk mendaftar perlombaan, upload dokumen, dan tracking status submission."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.4.0
  get: ^4.6.6

  # Networking
  http: ^1.1.0
  dio: ^5.4.0

  # Local Storage
  sqflite: ^2.3.3
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.0.0

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Image Handling
  image_picker: ^1.0.4
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
